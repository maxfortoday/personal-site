<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle rings -->
  <circle cx="400" cy="205" r="180" fill="none" stroke="#ffffff08" stroke-width="1"/>
  <circle cx="400" cy="205" r="140" fill="none" stroke="#ffffff08" stroke-width="1"/>

  <!-- Phone outline -->
  <rect x="310" y="95" width="180" height="320" rx="20" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <!-- Screen -->
  <rect x="322" y="115" width="156" height="260" rx="8" fill="#0c4a6e"/>
  <!-- Notch -->
  <rect x="368" y="108" width="64" height="12" rx="6" fill="#082f49"/>

  <!-- HUD -->
  <rect x="322" y="115" width="156" height="34" rx="8" fill="#075985"/>
  <text x="334" y="137" font-family="ui-monospace,monospace" font-size="11" fill="#7dd3fc">LV 12</text>
  <text x="466" y="137" font-family="ui-monospace,monospace" font-size="11" fill="#fde047" text-anchor="end">x4 COMBO</text>

  <!-- Play field with pixel grid -->
  <rect x="322" y="149" width="156" height="192" fill="#0a3f5c"/>
  <g stroke="#ffffff0a" stroke-width="1">
    <line x1="354" y1="149" x2="354" y2="341"/>
    <line x1="386" y1="149" x2="386" y2="341"/>
    <line x1="418" y1="149" x2="418" y2="341"/>
    <line x1="450" y1="149" x2="450" y2="341"/>
    <line x1="322" y1="181" x2="478" y2="181"/>
    <line x1="322" y1="213" x2="478" y2="213"/>
    <line x1="322" y1="245" x2="478" y2="245"/>
    <line x1="322" y1="277" x2="478" y2="277"/>
    <line x1="322" y1="309" x2="478" y2="309"/>
  </g>

  <!-- Golden bird (pixel blocky) -->
  <g>
    <rect x="404" y="196" width="40" height="30" rx="4" fill="#facc15"/>
    <rect x="440" y="204" width="12" height="10" fill="#f97316"/>
    <rect x="418" y="204" width="6" height="6" fill="#1e293b"/>
    <rect x="410" y="226" width="6" height="10" fill="#eab308"/>
    <rect x="428" y="226" width="6" height="10" fill="#eab308"/>
    <!-- sparkle -->
    <text x="398" y="196" font-family="ui-sans-serif,sans-serif" font-size="16" fill="#fef08a">✦</text>
  </g>
  <!-- tap ring -->
  <circle cx="424" cy="211" r="34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- small regular bird -->
  <g opacity="0.85">
    <rect x="348" y="280" width="26" height="20" rx="3" fill="#38bdf8"/>
    <rect x="372" y="285" width="8" height="7" fill="#0ea5e9"/>
    <rect x="356" y="285" width="4" height="4" fill="#082f49"/>
  </g>

  <!-- Bottom bar -->
  <rect x="322" y="341" width="156" height="34" rx="8" fill="#075985"/>
  <text x="400" y="363" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">Tap before it escapes!</text>

  <!-- Badges right side -->
  <rect x="520" y="135" width="120" height="36" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="580" y="150" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">Skia 60fps</text>
  <text x="580" y="165" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">Game Loop</text>

  <rect x="520" y="185" width="120" height="36" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="580" y="200" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">20 Levels</text>
  <text x="580" y="215" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">5 Worlds</text>

  <rect x="520" y="235" width="120" height="36" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="580" y="250" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">Cloud Functions</text>
  <text x="580" y="265" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">Score Integrity</text>

  <rect x="520" y="285" width="120" height="36" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="580" y="300" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">Expo + RN</text>
  <text x="580" y="315" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="700">iOS · Android</text>

  <!-- Bottom text -->
  <text x="400" y="405" font-family="ui-sans-serif,sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">Catch the Rooster</text>
</svg>
