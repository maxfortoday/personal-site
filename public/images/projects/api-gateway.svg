<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1445"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="400" cy="210" rx="240" ry="180" fill="url(#glow)"/>

  <!-- Client nodes (left) -->
  <circle cx="100" cy="130" r="22" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="135" font-family="ui-monospace,monospace" font-size="10" fill="#93c5fd" text-anchor="middle">REST</text>
  <circle cx="100" cy="210" r="22" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="215" font-family="ui-monospace,monospace" font-size="10" fill="#93c5fd" text-anchor="middle">SOAP</text>
  <circle cx="100" cy="290" r="22" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="295" font-family="ui-monospace,monospace" font-size="10" fill="#93c5fd" text-anchor="middle">XML</text>

  <!-- Lines: clients → gateway -->
  <line x1="122" y1="130" x2="308" y2="195" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="122" y1="210" x2="308" y2="210" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="122" y1="290" x2="308" y2="225" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>

  <!-- Central Shield (API Gateway) -->
  <polygon points="400,130 460,160 460,230 400,270 340,230 340,160" fill="url(#shield)" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="198" font-family="ui-sans-serif,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">API</text>
  <text x="400" y="214" font-family="ui-sans-serif,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="700">GATEWAY</text>

  <!-- Lines: gateway → services -->
  <line x1="460" y1="195" x2="640" y2="150" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
  <line x1="460" y1="210" x2="640" y2="210" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
  <line x1="460" y1="225" x2="640" y2="270" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>

  <!-- Service nodes (right) -->
  <circle cx="665" cy="150" r="22" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="665" y="155" font-family="ui-monospace,monospace" font-size="10" fill="#67e8f9" text-anchor="middle">SVC</text>
  <circle cx="665" cy="210" r="22" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="665" y="215" font-family="ui-monospace,monospace" font-size="10" fill="#67e8f9" text-anchor="middle">SVC</text>
  <circle cx="665" cy="270" r="22" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="665" y="275" font-family="ui-monospace,monospace" font-size="10" fill="#67e8f9" text-anchor="middle">SVC</text>

  <!-- Stats -->
  <rect x="270" y="295" width="110" height="36" rx="8" fill="#1e3a8a" opacity="0.8"/>
  <text x="325" y="311" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">500+ clients</text>
  <text x="325" y="325" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">2M calls/day</text>

  <rect x="420" y="295" width="110" height="36" rx="8" fill="#1e3a8a" opacity="0.8"/>
  <text x="475" y="311" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Auth0 JWT</text>
  <text x="475" y="325" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">Zero touch</text>

  <!-- Bottom text -->
  <text x="400" y="370" font-family="ui-sans-serif,sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">Enterprise API Gateway</text>
  <text x="400" y="400" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">Auth0 · Token Validation · Legacy Proxy · B2B Access</text>
</svg>
