<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f3d3d"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0d3b37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle dots grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff0a"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- Flow boxes -->
  <!-- Box 1: API GW -->
  <rect x="60" y="175" width="130" height="100" rx="12" fill="url(#box)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="125" y="215" font-family="ui-monospace,monospace" font-size="12" fill="#5eead4" text-anchor="middle" font-weight="700">API GW</text>
  <text x="125" y="233" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ingress</text>
  <text x="125" y="252" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">REST · Auth</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="225" x2="238" y2="225" stroke="#14b8a6" stroke-width="2"/>
  <polygon points="238,219 256,225 238,231" fill="#14b8a6"/>

  <!-- Box 2: SQS -->
  <rect x="256" y="175" width="130" height="100" rx="12" fill="url(#box)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="321" y="215" font-family="ui-monospace,monospace" font-size="12" fill="#5eead4" text-anchor="middle" font-weight="700">SQS</text>
  <text x="321" y="233" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Queue</text>
  <text x="321" y="252" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">DLQ · Retry</text>

  <!-- Arrow 2 -->
  <line x1="386" y1="225" x2="434" y2="225" stroke="#14b8a6" stroke-width="2"/>
  <polygon points="434,219 452,225 434,231" fill="#14b8a6"/>

  <!-- Box 3: EventBridge -->
  <rect x="452" y="175" width="130" height="100" rx="12" fill="url(#box)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="517" y="210" font-family="ui-monospace,monospace" font-size="11" fill="#5eead4" text-anchor="middle" font-weight="700">EventBridge</text>
  <text x="517" y="228" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Router</text>
  <text x="517" y="252" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">Rules · Filter</text>

  <!-- Arrow 3 -->
  <line x1="582" y1="225" x2="630" y2="225" stroke="#14b8a6" stroke-width="2"/>
  <polygon points="630,219 648,225 630,231" fill="#14b8a6"/>

  <!-- Box 4: Consumers (λ) -->
  <rect x="648" y="155" width="110" height="55" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="703" y="178" font-family="ui-monospace,monospace" font-size="14" fill="#4ade80" text-anchor="middle">λ consumer</text>
  <text x="703" y="198" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#166534" text-anchor="middle">Idempotent</text>

  <rect x="648" y="240" width="110" height="55" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="703" y="263" font-family="ui-monospace,monospace" font-size="14" fill="#4ade80" text-anchor="middle">λ consumer</text>
  <text x="703" y="283" font-family="ui-sans-serif,sans-serif" font-size="10" fill="#166534" text-anchor="middle">Idempotent</text>

  <!-- Feature flag badge -->
  <rect x="234" y="113" width="140" height="28" rx="14" fill="#0d3b37" stroke="#14b8a6" stroke-width="1"/>
  <text x="304" y="131" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#5eead4" text-anchor="middle" font-weight="600">Feature Flags</text>

  <rect x="394" y="113" width="140" height="28" rx="14" fill="#0d3b37" stroke="#14b8a6" stroke-width="1"/>
  <text x="464" y="131" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#5eead4" text-anchor="middle" font-weight="600">Zero Data Loss</text>

  <!-- Bottom text -->
  <text x="400" y="355" font-family="ui-sans-serif,sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">Event-Driven Data Pipeline</text>
  <text x="400" y="385" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#14b8a6" text-anchor="middle">SQS · EventBridge · Lambda · DLQ · Idempotency</text>
</svg>
