<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle circle rings -->
  <circle cx="400" cy="205" r="180" fill="none" stroke="#ffffff06" stroke-width="1"/>
  <circle cx="400" cy="205" r="140" fill="none" stroke="#ffffff06" stroke-width="1"/>

  <!-- Phone outline -->
  <rect x="310" y="95" width="180" height="320" rx="20" fill="#0a3d1f" stroke="#22c55e" stroke-width="2"/>
  <!-- Screen -->
  <rect x="322" y="115" width="156" height="260" rx="8" fill="#052e16"/>
  <!-- Notch -->
  <rect x="368" y="108" width="64" height="12" rx="6" fill="#0a3d1f"/>

  <!-- App header -->
  <rect x="322" y="115" width="156" height="40" rx="8" fill="#166534"/>
  <text x="400" y="140" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#4ade80" text-anchor="middle" font-weight="800">TzunAI</text>

  <!-- Food item scan area -->
  <rect x="334" y="165" width="132" height="90" rx="8" fill="#0d3b1f"/>
  <!-- Corner brackets (scan effect) -->
  <polyline points="340,168 334,168 334,177" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polyline points="460,168 466,168 466,177" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polyline points="340,252 334,252 334,243" fill="none" stroke="#22c55e" stroke-width="2"/>
  <polyline points="460,252 466,252 466,243" fill="none" stroke="#22c55e" stroke-width="2"/>
  <!-- Food emoji -->
  <text x="400" y="223" font-family="ui-sans-serif,sans-serif" font-size="42" text-anchor="middle">🥗</text>

  <!-- AI result card -->
  <rect x="330" y="265" width="140" height="90" rx="8" fill="#14532d"/>
  <text x="340" y="284" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#86efac" font-weight="700">✦ AI Analysis</text>
  <text x="340" y="300" font-family="ui-monospace,monospace" font-size="10" fill="#4ade80">Calories:  420 kcal</text>
  <text x="340" y="315" font-family="ui-monospace,monospace" font-size="10" fill="#4ade80">Protein:   28g</text>
  <text x="340" y="330" font-family="ui-monospace,monospace" font-size="10" fill="#4ade80">Carbs:     38g</text>
  <text x="340" y="345" font-family="ui-monospace,monospace" font-size="10" fill="#4ade80">Fat:       14g</text>

  <!-- Badges right side -->
  <rect x="520" y="135" width="120" height="36" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="580" y="150" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Hebrew-First</text>
  <text x="580" y="165" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">🇮🇱 Product</text>

  <rect x="520" y="185" width="120" height="36" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="580" y="200" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">OpenAI Vision</text>
  <text x="580" y="215" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">Structured JSON</text>

  <rect x="520" y="235" width="120" height="36" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="580" y="250" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">React Native</text>
  <text x="580" y="265" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">+ Firebase</text>

  <rect x="520" y="285" width="120" height="36" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="580" y="300" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Feedback Loop</text>
  <text x="580" y="315" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">Meal Reuse</text>

  <!-- Bottom text -->
  <text x="400" y="388" font-family="ui-sans-serif,sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">TzunAI</text>
  <text x="400" y="415" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#22c55e" text-anchor="middle">AI Nutrition Tracker · LLM · React Native · OpenAI</text>
</svg>
